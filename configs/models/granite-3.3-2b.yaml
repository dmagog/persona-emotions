# A model is added with one file like this. Everything that affects the run is here.
slug: granite-3.3-2b-instruct
hf_id: ibm-granite/granite-3.3-2b-instruct

load:
  dtype: float16         # pinned on purpose: auto-selection split the grid into bf16 and fp16
  trust_remote_code: false
  device_map: auto
  seed: 0

prompt:
  system_role: true      # if the template refuses, render_chat folds the frame into the user turn
  enable_thinking: false # required for Qwen3 and newer; the others ignore the key

stages:
  pairs:   { batch_size: 8, max_tokens: 256 }
  # coeffs are denser at the low end: on {0,4,8,16} three models out of four
  # stopped at 4, because at 8 the text was already breaking down. n_prompts is
  # 16 rather than 8: with eight, the degenerate share moves in steps of 12%, so
  # a 10% ceiling meant "none out of eight".
  sweep:   { layers: [0.35, 0.45, 0.55], coeffs: [0, 2, 4, 6, 8, 16], max_degen: 0.10, n_prompts: 16 }
  matrix:  { per_emotion: 8 }
  compose: { specs: allpairs }   # the full 42-pair X-Y matrix (the standard)

sae: null
