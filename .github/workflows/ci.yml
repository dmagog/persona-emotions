name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-inference.txt
      - run: python -m emotion.collect_compose --out /tmp/composition.md
      - run: python -m emotion.collect_dialog_safety --out /tmp/dialogue.md
      - run: python -m emotion.selftest
